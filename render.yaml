services:
  - type: web
    name: image-process-api
    runtime: node
    rootDir: server
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 4000
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        value: 3306
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: DB_NAME
        value: image_platform
      - key: STORAGE_PATH
        value: ./storage
      - key: SESSION_SECRET
        generateValue: true
      - key: ADMIN_SEED_PASSWORD
        sync: false
      - key: CORS_ORIGIN
        sync: false
